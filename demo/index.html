<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>软件定义卫星 · 演示预览</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#05080f; --panel:#0b1220; --line:#1b2740; --line2:#243352;
    --txt:#d8e2f0; --dim:#7a8aa5; --dim2:#55647f;
    --blue:#4a90ff; --cyan:#57d6ff; --green:#6fe3a1; --amber:#ffc66e; --red:#ff6b6b;
  }
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--txt); overflow:hidden;
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;
    display:flex; flex-direction:column;
  }

  /* ============ 顶栏 ============ */
  header{
    flex:0 0 auto; display:flex; align-items:center; gap:14px;
    padding:9px 16px; background:linear-gradient(180deg,#0d1729,#0a1220);
    border-bottom:1px solid var(--line); z-index:20;
  }
  .brand{font-size:14px;font-weight:700;color:#bfe0ff;letter-spacing:.6px;white-space:nowrap}
  .brand small{display:block;font-size:10px;font-weight:400;color:var(--dim2);letter-spacing:0}
  .tabs{display:flex;gap:7px;margin-left:8px;flex-wrap:wrap}
  .tab{
    background:#132039; color:#9db3d4; border:1px solid var(--line2);
    border-radius:7px; padding:7px 15px; font-size:19px; cursor:pointer;
    transition:all .18s; white-space:nowrap; font-family:inherit;
  }
  .tab:hover{background:#1a2c4d;color:#cfe3ff}
  .tab.active{background:linear-gradient(180deg,#2f7bff,#1e5fd4); border-color:#5a9bff;
    color:#fff; box-shadow:0 0 12px rgba(74,144,255,.45);}
  .tab .n{opacity:.65;margin-right:6px;font-family:Consolas,monospace;font-size:18px}
  .spacer{flex:1}
  .ctrl{display:flex;align-items:center;gap:7px}
  .cbtn{background:#132039;color:#8fa3c2;border:1px solid var(--line2);border-radius:6px;
    padding:5px 10px;font-size:11.5px;cursor:pointer;font-family:inherit;transition:.18s;}
  .cbtn:hover{background:#1a2c4d;color:#cfe3ff}
  .urlinfo{font-family:Consolas,monospace;font-size:11px;color:var(--dim2);
    background:#0a1120;border:1px solid var(--line);border-radius:6px;padding:4px 9px;
    max-width:330px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .urlinfo b{color:var(--cyan);font-weight:600}
  .progline{flex:0 0 auto;height:2px;background:#111c30;position:relative;z-index:20}
  .progline i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#2f7bff,#57d6ff);width:0%}

  /* ============ 主体 ============ */
  main{flex:1;display:flex;min-height:0}
  #stage{flex:2;position:relative;min-width:0;background:#02040a;overflow:hidden}
  #gl{display:block;width:100%;height:100%}
  .hud{position:absolute;inset:0;pointer-events:none}

  .scenebadge{position:absolute;left:16px;top:14px;
    background:rgba(8,14,26,.72);border:1px solid var(--line2);border-left:3px solid var(--blue);
    border-radius:6px;padding:7px 12px;backdrop-filter:blur(6px);}
  .scenebadge .k{font-size:11px;color:var(--dim2);letter-spacing:1px}
  .scenebadge .v{font-size:15px;color:#cfe3ff;font-weight:700;margin-top:2px}
  .scenebadge .s{font-size:11px;color:var(--dim);margin-top:2px}

  /* ---- 顶部居中横幅：当前环节（字号加大，便于远看） ---- */
  .banner{
    position:absolute;left:50%;top:14px;transform:translateX(-50%);
    background:linear-gradient(180deg,rgba(22,40,70,.94),rgba(11,21,40,.94));
    border:1px solid rgba(90,140,220,.62);border-radius:9px;
    padding:9px 30px;backdrop-filter:blur(9px);
    box-shadow:0 8px 26px rgba(0,0,0,.52), 0 0 0 1px rgba(120,180,255,.10) inset;
    display:flex;align-items:center;gap:11px;white-space:nowrap;
  }
  .banner .step{
    font-family:Consolas,monospace;font-size:13px;color:var(--cyan);
    border:1px solid rgba(87,214,255,.45);border-radius:5px;padding:1px 7px;
  }
  .banner .tx{font-size:20px;font-weight:700;color:#eaf2ff;letter-spacing:3px}

  .subtitle{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);
    max-width:min(780px,88%);text-align:center;
    background:rgba(8,14,26,.82);border:1px solid var(--line2);border-radius:8px;
    padding:9px 18px;backdrop-filter:blur(6px);}
  .subtitle .ph{font-size:11px;color:var(--cyan);letter-spacing:2px;margin-bottom:3px}
  .subtitle .tx{font-size:14px;color:#e8f0fb;line-height:1.55}

  .hudbox{position:absolute;background:rgba(8,14,26,.78);border:1px solid var(--line2);
    border-radius:7px;padding:8px 12px;backdrop-filter:blur(6px);font-family:Consolas,monospace;min-width:180px}
  .hudbox .lbl{font-size:10.5px;color:var(--dim2);letter-spacing:.5px}
  .hudbox .num{font-size:17px;font-weight:700;color:#e8f0fb;letter-spacing:.5px}
  .hudbox .num.red{color:var(--red)} .hudbox .num.green{color:var(--green)} .hudbox .num.amber{color:var(--amber)}
  .hudbox .row2{font-size:11px;color:var(--dim);margin-top:3px}

  #hudReticle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:190px;height:190px;opacity:0;transition:opacity .35s;}
  #hudReticle.on{opacity:1}
  #hudReticle div{position:absolute;width:26px;height:26px;border:2.5px solid var(--green)}
  #hudReticle .tl{left:0;top:0;border-right:0;border-bottom:0}
  #hudReticle .tr{right:0;top:0;border-left:0;border-bottom:0}
  #hudReticle .bl{left:0;bottom:0;border-right:0;border-top:0}
  #hudReticle .br{right:0;bottom:0;border-left:0;border-top:0}
  #hudReticle .lab{position:absolute;left:0;top:-24px;border:0;width:auto;height:auto;
    background:rgba(8,14,26,.85);color:var(--green);font-size:12px;
    font-family:Consolas,monospace;padding:2px 8px;border-radius:4px;
    white-space:nowrap;display:inline-block;min-width:max-content;}

  .warn{position:absolute;left:50%;top:58px;transform:translateX(-50%);
    background:rgba(60,8,8,.82);border:1px solid #ff6b6b;color:#ffb3b3;
    border-radius:6px;padding:6px 16px;font-size:13px;font-weight:700;
    letter-spacing:1.5px;opacity:0;transition:opacity .2s;font-family:Consolas,monospace;}
  .warn.on{opacity:1;animation:blink .7s steps(2,end) infinite}
  @keyframes blink{0%{opacity:1}50%{opacity:.28}100%{opacity:1}}
  @keyframes bannerPop{
    0%{opacity:.2;transform:translateX(-50%) translateY(-10px) scale(.94)}
    60%{opacity:1;transform:translateX(-50%) translateY(1px) scale(1.02)}
    100%{opacity:1;transform:translateX(-50%)}
  }

  /* ---- 载荷观测窗口（弹出）
     默认即为"全屏"尺寸：覆盖整个演示区，关闭时收回 ---- */
  #payloadWin{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);
    width:calc(100% - 108px);height:calc(100% - 180px);margin-top:-28px;
    display:flex;flex-direction:column;
    background:rgba(9,15,28,.96);border:1px solid rgba(90,140,220,.7);border-radius:12px;
    overflow:hidden;box-shadow:0 22px 60px rgba(0,0,0,.78);
    opacity:0;visibility:hidden;pointer-events:none;
    backdrop-filter:blur(10px);
  }
  #payloadWin.on{opacity:1;visibility:visible;transform:translate(-50%,-50%)}
  /* 开/关的动效由 JS 的 WAAPI 驱动（见 payload()）。
     不用 CSS transition/animation：backdrop-filter 会让 340ms 的过渡
     在 Chromium 里一直处于 running、永不结束，导致关窗后暗不下去。 */
  #payloadWin .hd{display:flex;align-items:center;gap:9px;padding:11px 16px;flex:0 0 auto;
    background:rgba(20,32,54,.92);border-bottom:1px solid rgba(60,90,140,.45);font-size:14px}
  #payloadWin .hd .dot{width:9px;height:9px;border-radius:50%;background:var(--green);
    box-shadow:0 0 7px var(--green);animation:blink 1.1s infinite}
  #payloadWin .hd .md{margin-left:auto;color:var(--amber);font-size:14px;font-weight:700}
  #payloadWin .cam-body{flex:1;position:relative;min-height:0}
  #payloadWin canvas{display:block;width:100%;height:100%;background:#04070d}
  #payloadWin .ft{padding:9px 16px;font-size:13px;color:#9db3d4;flex:0 0 auto;
    background:rgba(20,32,54,.92);border-top:1px solid rgba(60,90,140,.45);
    display:flex;gap:16px;flex-wrap:wrap;font-family:Consolas,monospace}
  #payloadWin .ft b{color:var(--green);font-weight:700}

  /* ---- 载荷能力清单（算法上注场景用） ---- */
  #capPanel{
    position:absolute;left:22px;top:100px;width:238px;
    background:rgba(9,15,28,.93);border:1px solid rgba(90,140,220,.55);border-radius:9px;
    padding:10px 13px;backdrop-filter:blur(8px);
    opacity:0;transform:translateY(-10px);pointer-events:none;
    transition:opacity .4s cubic-bezier(.2,.9,.3,1.1), transform .4s cubic-bezier(.2,.9,.3,1.1);
    font-family:Consolas,monospace;box-shadow:0 12px 34px rgba(0,0,0,.5);
  }
  #capPanel.on{opacity:1;transform:none}
  #capPanel .t{font-size:12px;color:#7fb3ff;margin-bottom:7px;letter-spacing:.5px}
  #capPanel .it{display:flex;align-items:center;gap:7px;font-size:12.5px;
    color:#94a8c2;padding:3.5px 0}
  #capPanel .it .ck{width:12px;text-align:center;color:#6fe3a1}
  #capPanel .it.new{color:#ffd166;font-weight:700;
    animation:capPop .62s cubic-bezier(.2,.9,.3,1.45) both}
  #capPanel .it.new .ck{color:#ffd166}
  @keyframes capPop{
    0%{opacity:0;transform:translateX(-14px) scale(.88)}
    70%{opacity:1;transform:translateX(2px) scale(1.03)}
    100%{opacity:1;transform:none}
  }

  /* ---- 一级分组按钮 ---- */
  .tabrows{display:flex;flex-direction:column;gap:7px;align-items:flex-start}
  .tabrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .gbtn{
    background:#0f1b2f;color:#7f93b0;border:1px solid var(--line2);border-radius:6px;
    padding:7px 17px;font-size:19.5px;font-weight:700;cursor:pointer;font-family:inherit;
    transition:all .18s;white-space:nowrap;
  }
  .gbtn:hover{background:#17263f;color:#cfe3ff}
  .gbtn.active{background:linear-gradient(180deg,#1f5fd0,#17499e);border-color:#4a8bff;
    color:#fff;box-shadow:0 0 12px rgba(74,144,255,.4)}
  /* 一级任务完成：转绿 + 打 ✓ + 脉冲一次 */
  .gbtn.done{background:linear-gradient(180deg,#1f9d63,#137a4a)!important;
    border-color:#5fdfa0!important;color:#fff!important;
    box-shadow:0 0 16px rgba(72,209,140,.55)!important}
  .gbtn.done::before{content:'✓';margin-right:6px;font-weight:800;color:#c9ffe2}
  .gbtn.pulse{animation:gPulse 1.2s ease-out 1}
  @keyframes gPulse{
    0%  {box-shadow:0 0 0 0 rgba(72,209,140,.9)}
    100%{box-shadow:0 0 0 18px rgba(72,209,140,0)}
  }
  .gsep{width:1px;height:26px;background:var(--line2);margin:0 4px}

  /* ============ 右侧任务栏 ============ */
  #panel{flex:1;min-width:460px;max-width:640px;background:var(--panel);
    border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .phead{flex:0 0 auto;padding:14px 18px;border-bottom:1px solid var(--line);background:#0d1729}
  .phead .t{font-size:30px;color:#bfe0ff;font-weight:700;line-height:1.25}
  .phead .st{font-size:24px;color:var(--dim);margin-top:5px;line-height:1.4}
  .phead .cap{display:inline-block;margin-top:9px;font-size:22px;padding:4px 13px;border-radius:12px;
    background:#16233c;border:1px solid var(--line2);color:#8fa3c2;font-family:Consolas,monospace}
  .pbody{flex:1;overflow-y:auto;padding:14px 18px 26px;scroll-behavior:smooth}
  .pbody::-webkit-scrollbar{width:10px}
  .pbody::-webkit-scrollbar-thumb{background:#22314f;border-radius:5px}

  /* 阶段框：依次"弹出" */
  @keyframes phasePop{
    0%{opacity:0;transform:translateY(16px) scale(.94)}
    60%{opacity:1;transform:translateY(-2px) scale(1.012)}
    100%{opacity:1;transform:none}
  }
  .phase{position:relative;margin-bottom:14px;border:1px solid var(--line);border-radius:10px;
    background:#0d1526;overflow:hidden;animation:phasePop .46s cubic-bezier(.22,.9,.32,1.1) both;}
  .phase::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:var(--amber);transition:.35s}
  .phase.done::before{background:var(--green)}
  .phase .ph{display:flex;align-items:center;gap:11px;padding:12px 15px 8px;
    font-size:29px;font-weight:700;color:#9ecbff}
  .phase.done .ph{color:#8fd6b0}
  .phase .badge{margin-left:auto;font-size:22px;font-family:Consolas,monospace;
    color:var(--cyan);border:1px solid #2b4a6b;border-radius:12px;padding:3px 12px}
  .phase.done .badge{color:var(--green);border-color:#2c5a44}
  .phase ul{list-style:none;padding:0 15px 13px}
  /* 子项也依次浮现 → 强化"正在自主决策"的过程感 */
  .phase li{font-size:27px;color:#94a8c2;line-height:1.62;padding-left:24px;position:relative;
    opacity:0;transform:translateX(-7px);
    transition:opacity .34s ease, transform .34s ease, color .3s}
  .phase li.show{opacity:1;transform:none}
  .phase li::before{content:"";position:absolute;left:4px;top:18px;width:9px;height:9px;
    border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
  .phase.active li::before{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
  .phase li .svc{color:#ffd166;font-family:Consolas,monospace;font-size:27px;font-weight:700;
    border:1.5px solid rgba(255,209,102,.72);background:rgba(140,100,20,.32);
    border-radius:5px;padding:0 8px;margin-right:6px;display:inline-block;line-height:1.45;
    box-shadow:0 0 10px rgba(255,200,80,.22)}

  .dlbar{margin:2px 0 12px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#0d1526}
  .dlbar .hd{display:flex;justify-content:space-between;font-size:22px;color:var(--dim);margin-bottom:6px}
  .dlbar .hd b{color:var(--cyan);font-family:Consolas,monospace}
  .dlbar .tr{height:7px;background:#16233c;border-radius:4px;overflow:hidden}
  .dlbar .tr i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#2f7bff,#57d6ff);transition:width .25s}

  .legend{flex:0 0 auto;padding:9px 18px;border-top:1px solid var(--line);
    font-size:21px;color:var(--dim2);display:flex;gap:12px;flex-wrap:wrap;background:#0a1220}
  .legend span::before{content:"●";margin-right:4px}

  #loading{position:fixed;inset:0;background:#05080f;display:flex;align-items:center;
    justify-content:center;flex-direction:column;gap:12px;z-index:99;transition:opacity .5s}
  #loading .tt{font-size:15px;color:#9ecbff}
  #loading .bb{width:220px;height:3px;background:#16233c;border-radius:2px;overflow:hidden}
  #loading .bb i{display:block;height:100%;width:0%;background:var(--blue);transition:width .3s}
  #loading.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>

<header>
  <div class="brand">软件定义卫星 · 演示预览<small>Software-Defined Satellite / Demo Preview</small></div>
  <div class="tabs" id="tabs"></div>
  <div class="spacer"></div>
  <div class="ctrl">
    <button class="cbtn" id="btnPlay">⏸ 暂停</button>
    <button class="cbtn" id="btnSpeed">1.0×</button>
    <div class="urlinfo" id="urlinfo">URL: <b>?scene=1</b></div>
  </div>
</header>
<div class="progline"><i id="prog"></i></div>

<main>
  <section id="stage">
    <canvas id="gl"></canvas>
    <div class="hud">
      <div class="scenebadge">
        <div class="k" id="hbK">SCENE 01</div>
        <div class="v" id="hbV">拍摄月亮</div>
        <div class="s" id="hbS">—</div>
      </div>

      <!-- 顶部居中横幅：当前任务环节 -->
      <div class="banner" id="banner">
        <span class="step" id="banStep">01</span>
        <span class="tx" id="banTx">指令接收</span>
      </div>

      <div class="hudbox" id="hudA" style="right:16px;top:14px;display:none">
        <div class="lbl" id="hudA_l">—</div><div class="num" id="hudA_v">—</div>
        <div class="row2" id="hudA_r">—</div>
      </div>
      <div class="hudbox" id="hudB" style="right:16px;top:112px;display:none">
        <div class="lbl" id="hudB_l">—</div><div class="num" id="hudB_v">—</div>
        <div class="row2" id="hudB_r">—</div>
      </div>

      <!-- 载荷能力清单（算法上注时显示） -->
      <div id="capPanel">
        <div class="t">载荷能力清单</div>
        <div id="capList"></div>
      </div>

      <div id="hudReticle">
        <div class="lab" id="reticLab">目标锁定</div>
        <div class="tl"></div><div class="tr"></div><div class="bl"></div><div class="br"></div>
      </div>
      <div class="warn" id="warnBox">⚠ 碰撞预警 COLLISION WARNING</div>

      <!-- 载荷观测窗口 -->
      <div id="payloadWin">
        <div class="hd"><span class="dot"></span><span>载荷观测窗口</span>
          <span class="md" id="pwMode">月球定标</span></div>
        <div class="cam-body"><canvas id="pwCanvas" width="1120" height="660"></canvas></div>
        <div class="ft">
          <span id="pwDet">目标锁定 <b>月球</b></span>
          <span>置信度 <b id="pwConf">0.98</b></span>
          <span id="pwMeta">曝光 1/2000s</span>
        </div>
      </div>

      <div class="subtitle">
        <div class="ph" id="subPh">指令接收</div>
        <div class="tx" id="subTx">—</div>
      </div>
    </div>
  </section>

  <aside id="panel">
    <div class="phead">
      <div class="t" id="pTitle">拍摄月亮</div>
      <div class="st" id="pSub">—</div>
      <div class="cap" id="pCap">L2 星上辅助</div>
    </div>
    <div class="pbody" id="pBody"></div>
    <div class="legend">
      <span style="color:#6fe3a1">已完成</span>
      <span style="color:#57d6ff">进行中</span>
      <span style="color:#7a8aa5">空格暂停 / 1-4 切场景</span>
    </div>
  </aside>
</main>

<div id="loading">
  <div class="tt">正在加载三维场景与真实贴图…</div>
  <div class="bb"><i id="ldBar"></i></div>
</div>

<script src="vendor/three.min.js"></script>
<script>
/* =========================================================================
   软件定义卫星 · 演示预览 (v2)
   ---------------------------------------------------------------------
   本版重点修正（依审阅意见）:
   1. 卫星始终位于所绘轨道线上（含变轨后重绘轨道环），不再"离轨"
   2. 场景1 增加地面站上行动效；成像后回传至【中国大陆】地面站，再接收新指令
   3. 场景2 变轨采用【顺行加速】——推力向前、喷焰向后（原版方向错误）
   4. 场景4 明确在【返回本土上空】后回传，不在美国上空下传
   5. 月球移至画面右侧；地球/卫星/月亮构图重新排布
   6. 右侧任务框【依次弹出】+ 子项逐条浮现（体现自主决策过程，而非预设清单）
   7. 新增【载荷观测窗口】弹出，显示识别框与拍摄画面
   ========================================================================= */

/* ---------------- 缓动 ---------------- */
const EASE = {
  linear:     t => t,
  inOutCubic: t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2,
  outCubic:   t => 1 - Math.pow(1-t,3),
  inCubic:    t => t*t*t,
  outQuint:   t => 1 - Math.pow(1-t,5),
  inOutSine:  t => -(Math.cos(Math.PI*t)-1)/2,
  outBack:    t => { const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); },
  inQuad:     t => t*t,
};
const lerp  = (a,b,t) => a + (b-a)*t;
const clamp = (v,a,b) => Math.min(b,Math.max(a,v));
const seg = (p,p0,p1,e) => { const t = clamp((p-p0)/(p1-p0),0,1); return e ? EASE[e](t) : t; };
const lerpV3 = (a,b,t,out) => out.set(lerp(a.x,b.x,t), lerp(a.y,b.y,t), lerp(a.z,b.z,t));
const V = (x,y,z) => new THREE.Vector3(x,y,z);
const DEG = Math.PI/180;

/* ---------------- 几何常量（示意比例，非真实比例） ---------------- */
const R_EARTH  = 100;
const ORBIT_R  = 250;
const ORBIT_INC = 48*DEG;          // 轨道倾角：使星下点纬度可达 ±48°，覆盖目标纬度
const MOON_R   = 75;
const MOON_POS = V(315, 117, -780);  // 月球置于画面【右侧】（原版在左，构图失衡）

/* 经纬度 → 三维单位向量（与等距圆柱贴图对应） */
function llToVec(lat, lon, r){
  const phi = (90-lat)*DEG, th = (lon+180)*DEG;
  return V(-r*Math.sin(phi)*Math.cos(th), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(th));
}
/* 轨道位置：倾角为 ORBIT_INC 的圆轨道（保证星下点纬度可达 ±ORBIT_INC） */
function orbitPos(aDeg, radius){
  const a = aDeg*DEG, R = radius===undefined ? ORBIT_R : radius;
  return V(R*Math.cos(a), R*Math.sin(a)*Math.sin(ORBIT_INC), R*Math.sin(a)*Math.cos(ORBIT_INC));
}
/* 轨道切向（速度方向）——用于变轨时的推力轴指向 */
function orbitVel(aDeg, radius){
  const a = aDeg*DEG;
  return V(-Math.sin(a), Math.cos(a)*Math.sin(ORBIT_INC), Math.cos(a)*Math.cos(ORBIT_INC)).normalize();
}
/* 使星下点纬度 = lat 的轨道相位角（取下降段） */
function phaseForLat(lat){
  const s = Math.sin(lat*DEG)/Math.sin(ORBIT_INC);
  return 180 - Math.asin(clamp(s,-1,1))/DEG;
}
/* 水平方位角（用于对齐地球自转） */
const horizAngle = v => Math.atan2(v.z, v.x);
/* 计算使地面点转到卫星下方的地球自转角 */
function yawAlignSatToGround(aDeg, lat, lon){
  const p = orbitPos(aDeg);
  return horizAngle(llToVec(lat, lon, 1)) - horizAngle(p);
}

/* --- 轨道环（可重绘：变轨后半径变化） --- */
function buildOrbitLine(){
  const pts = [];
  for (let i=0;i<=256;i++) pts.push(orbitPos(i/256*360));
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  const line = new THREE.Line(g, new THREE.LineBasicMaterial({
    color:0x5b8fd0, transparent:true, opacity:.5 }));
  line.userData.radius = ORBIT_R;
  return line;
}
function setOrbitRadius(r){
  if (Math.abs(orbitLine.userData.radius - r) < .5) return;
  const pts = [];
  for (let i=0;i<=256;i++) pts.push(orbitPos(i/256*360, r));
  orbitLine.geometry.dispose();
  orbitLine.geometry = new THREE.BufferGeometry().setFromPoints(pts);
  orbitLine.userData.radius = r;
}

function makeRingTexture(){
  const S=256, cv=document.createElement('canvas'); cv.width=cv.height=S;
  const c=cv.getContext('2d');
  c.strokeStyle='rgba(255,107,107,.95)'; c.lineWidth=7;
  c.beginPath(); c.arc(S/2,S/2,S/2-16,0,7); c.stroke();
  c.strokeStyle='rgba(255,107,107,.45)'; c.lineWidth=3;
  c.beginPath(); c.arc(S/2,S/2,S/2-34,0,7); c.stroke();
  c.strokeStyle='rgba(255,107,107,.95)'; c.lineWidth=9;
  for (let i=0;i<4;i++){
    const a=i*Math.PI/2+Math.PI/4, r1=S/2-38, r2=S/2-10;
    c.beginPath(); c.moveTo(S/2+Math.cos(a)*r1, S/2+Math.sin(a)*r1);
    c.lineTo(S/2+Math.cos(a)*r2, S/2+Math.sin(a)*r2); c.stroke();
  }
  return new THREE.CanvasTexture(cv);
}

function buildStation(){
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(6,8,3,20),
    new THREE.MeshPhongMaterial({ color:0x3a4658 })));
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(1.6,2,14,12),
    new THREE.MeshPhongMaterial({ color:0x8b98a8 })); mast.position.y=8; g.add(mast);
  const dish = new THREE.Mesh(new THREE.SphereGeometry(12,26,18,0,Math.PI*2,0,Math.PI/2.5),
    new THREE.MeshPhongMaterial({ color:0xc3d0e0, shininess:80, side:THREE.DoubleSide }));
  dish.position.y=16; dish.rotation.x=-Math.PI/3.1; g.add(dish);
  /* 站点标记（恒面向相机的精灵，便于识别） */
  const cv=document.createElement('canvas'); cv.width=cv.height=128;
  const c=cv.getContext('2d');
  c.strokeStyle='rgba(87,214,255,.95)'; c.lineWidth=6;
  c.beginPath(); c.arc(64,64,50,0,7); c.stroke();
  c.fillStyle='rgba(87,214,255,.95)';
  c.beginPath(); c.arc(64,64,12,0,7); c.fill();
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map:new THREE.CanvasTexture(cv),
    transparent:true, opacity:.9, blending:THREE.AdditiveBlending, depthWrite:false }));
  spr.scale.set(46,46,1); spr.position.y = 26; g.add(spr);
  return g;
}

const TRAIL_N = 150;
function makeTrail(color){
  const geo = new THREE.BufferGeometry(), arr = new Float32Array(TRAIL_N*3);
  geo.setAttribute('position', new THREE.BufferAttribute(arr,3));
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color,
    transparent:true, opacity:.75, blending:THREE.AdditiveBlending, depthWrite:false }));
  line.frustumCulled = false;
  return { line, arr, n:0 };
}
function pushTrail(tr,v){
  if (tr.n < TRAIL_N) tr.n++;
  for (let i=tr.n-1;i>0;i--){
    tr.arr[i*3]=tr.arr[(i-1)*3]; tr.arr[i*3+1]=tr.arr[(i-1)*3+1]; tr.arr[i*3+2]=tr.arr[(i-1)*3+2];
  }
  tr.arr[0]=v.x; tr.arr[1]=v.y; tr.arr[2]=v.z;
  tr.line.geometry.setDrawRange(0,tr.n);
  tr.line.geometry.attributes.position.needsUpdate = true;
}
function clearTrail(tr){ tr.n=0; tr.line.geometry.setDrawRange(0,0); }

function onResize(){
  const cv = document.getElementById('gl');
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!w||!h) return;
  renderer.setSize(w,h,false);
  camera.aspect = w/h; camera.updateProjectionMatrix();
}

/* =========================================================================
   复位（场景切换时清场）
   ========================================================================= */
function hideAll(){
  debrisMesh.visible=false; debrisTrail.line.visible=false; satTrail.line.visible=false;
  linkBeam.visible=false; swathBand.visible=false; targetMark.visible=false;
  gsBeam.visible=false;
  packets.forEach(p=>p.mesh.visible=false);
  gsRing.forEach(r=>r.visible=false);
  if (satFlame) satFlame.visible=false;
  if (satLens) satLens.material.color.setHex(0x6fe3a1);
  gsGrp.visible = false;
  orbitLine.visible = true;
  setOrbitRadius(ORBIT_R);
  earthGrp.rotation.y = 0;
  gsGrp.position.copy(llToVec(GS_LAT, GS_LON, R_EARTH));
  stationOrient();
  targetMark.position.copy(llToVec(TGT_LAT, TGT_LON, R_EARTH*1.012));
  swayBandReset();
  payloadKill();                // 切场景：观测窗直接归零，不留淡出残影
  payReset();
  capPanel(false);              // 载荷能力清单也需关闭（否则切场景后残留）
  clearTrail(satTrail); clearTrail(debrisTrail);
}
function swayBandReset(){ swathBand.visible=false; }

/* 地面站姿态：以地表法线为"上"，使天线朝外（无需依赖 lookAt 的父子坐标） */
function stationOrient(){
  const dir = llToVec(GS_LAT, GS_LON, 1).normalize();     // 局部法线
  const q = new THREE.Quaternion().setFromUnitVectors(V(0,1,0), dir);
  gsGrp.quaternion.copy(q);
}

/* =========================================================================
   场景 1 · 拍摄月亮
   流程：地面站上行指令 → 任务拆解 → 姿态指向 → 成像 → 回传本土
   ========================================================================= */
function driveMoon(p, t, dt){
  gsGrp.visible = true;

  /* 卫星沿轨道运行（始终在轨道线上）。
     相位安排（关键，已数值校核）：
     · 弧段 aGS+12° → aGS —— 全程处于中国站可见带内（可见半角 74°）
     · 回传时刻（p→1）相位收敛到 aGS，即卫星【正过中国站上空】
       （实测回传段与地面站角距 0.6°→0.0°，链路真实可信） */
  const aGS = phaseForLat(GS_LAT);            // 地面站过顶时的相位
  const a0 = aGS + 12, a1 = aGS;
  const ang = lerp(a0, a1, EASE.inOutSine(seg(p,0,1)));
  const sp = orbitPos(ang);
  satellite.position.copy(sp);
  satellite.lookAt(moonMesh.position);
  setOrbitRadius(ORBIT_R);

  /* 地球自转：固定使地面站对准过顶相位 → 卫星渐次飞临本土站上方 */
  const yaw0 = yawAlignSatToGround(aGS, GS_LAT, GS_LON);
  earthGrp.rotation.y = yaw0;
  cloudMesh.rotation.y = yaw0 + t*.008;

  const camPos = V(), look = V();
  const moonDir = moonMesh.position.clone().sub(sp).normalize();

  /* ---------- 段 1（0~.24）地面站上行指令：卫星与地面站同框，链路沿径向 ---------- */
  if (p < .24){
    const k = seg(p, 0, .24, 'inOutCubic');
    /* 机位：从侧上方看，能把地面站(40N)与卫星同时收进画面 */
    const gsWorld = llToVec(GS_LAT, GS_LON, R_EARTH).applyAxisAngle(V(0,1,0), earthGrp.rotation.y);
    const mid = gsWorld.clone().lerp(sp, .45);
    const axis = sp.clone().sub(gsWorld).normalize();
    let cd = new THREE.Vector3().crossVectors(axis, V(0,1,0)); 
    if (cd.lengthSq()<1e-4) cd = V(0,0,1);
    cd.normalize();
    const dist = lerp(760, 620, k);
    camPos.copy(mid).addScaledVector(cd, dist*.9).addScaledVector(V(0,1,0), dist*.42);
    look.copy(mid);
    orbitLine.visible = true;
    reticle(false); warn(false);
    payload(false);

    gsRing.forEach((ring,i)=>{
      ring.visible = true;
      const q = ((t*.5 + ring.userData.ph) % 1);
      ring.position.copy(gsWorld.clone().multiplyScalar(1.02));
      ring.quaternion.setFromUnitVectors(V(0,0,1), gsWorld.clone().normalize());
      ring.scale.setScalar(3 + q*40);
      ring.material.opacity = .7*(1-q);
    });
    gsBeam.visible = true;
    const midB = gsWorld.clone().add(sp).multiplyScalar(.5);
    gsBeam.position.copy(midB);
    gsBeam.scale.set(1, gsWorld.distanceTo(sp), 1);
    gsBeam.quaternion.setFromUnitVectors(V(0,1,0), sp.clone().sub(gsWorld).normalize());
    gsBeam.material.opacity = .2 + .28*Math.abs(Math.sin(t*4));

    hud('A', '任务类型', '对月成像', '来自本土地面站');
    hud('B', '指令状态', p<.12?'指令上注中':'指令已接收', p<.12?'上行链路建立':'开始任务拆解');
    hudTone(''); hudBTone(p<.12?'amber':'green');
    banner(1,'指令接收');
    sub('指令接收', p<.12 ? '本土地面站上注任务：拍摄月球（上行链路建立）'
                          : '卫星接收任务指令 → 启动自主任务拆解');
  }
  /* ---------- 段 2（.24~.46）任务拆解 + 姿态机动 ---------- */
  else if (p < .46){
    const k = seg(p, .24, .46, 'inOutCubic');
    const near = sp.clone().add(V(0,52,138));
    /* 从段1机位平滑推到卫星近景 */
    const gsWorld = llToVec(GS_LAT, GS_LON, R_EARTH).applyAxisAngle(V(0,1,0), earthGrp.rotation.y);
    const mid = gsWorld.clone().lerp(sp, .45);
    const axis = sp.clone().sub(gsWorld).normalize();
    let cd = new THREE.Vector3().crossVectors(axis, V(0,1,0));
    if (cd.lengthSq()<1e-4) cd = V(0,0,1);
    cd.normalize();
    const c0 = mid.clone().addScaledVector(cd, 620*.9).addScaledVector(V(0,1,0), 620*.42);
    lerpV3(c0, near, k, camPos);
    lerpV3(mid, sp, k, look);
    orbitLine.visible = true;
    reticle(false); warn(false);
    gsBeam.visible = false;
    /* 观测窗口：从本段起持续显示，直到回传结束才关闭（不再中途开合） */
    payload(false);        // 姿态机动段：观测窗保持关闭
    const err = lerp(9.2, .35, seg(p,.30,.46,'outCubic'));
    hud('A', '姿态指向误差', err.toFixed(2)+'°', '目标：月球');
    hud('B', '控制模式', '姿态机动中', '反作用飞轮输出力矩');
    hudTone(err>2?'amber':'green'); hudBTone('');
    sub(p<.34?'自感知':'自决策',
      p<.34 ? 'GPS 定轨 · 星敏+陀螺读姿态 · 太敏太阳矢量 · 查月球星历解算方位'
            : '解算目标指向姿态 · 规划最短角距机动路径 · 估算机动耗时与过曝风险 · 排定曝光参数');
  }
  /* ---------- 段 3（.46~.76）保持卫星与月亮同框，相机识别用旁侧小窗展示 ---------- */
  else if (p < .76){
    const k = seg(p, .46, .76, 'inOutSine');
    /* 机位：退到卫星侧后方，把卫星与月亮一起收进画面（不推近月球） */
    const side = new THREE.Vector3(0,1,0).cross(moonDir).normalize();
    const upv  = moonDir.clone().cross(side).normalize();
    camPos.copy(sp)
          .addScaledVector(moonDir, lerp(-150, -230, k))
          .addScaledVector(side, lerp(150, 118, k))
          .addScaledVector(upv, lerp(52, 40, k));
    look.copy(sp).lerp(moonMesh.position, .42);          // 视线在卫星与月球之间
    orbitLine.visible = true;
    reticle(false); warn(false);
    const err = lerp(.35,.05, seg(p,.46,.76,'outQuint'));
    hud('A', '指向误差', err.toFixed(2)+'°', p>.58?'已稳定指向月球 ✓':'星敏精定姿');
    hudTone('green');
    hud('B', '相机状态', p<.58?'自动测光':(p<.72?'成像中':'成像完成'),
      p<.58?'月球亮度高 · 短曝光防过曝':(p<.72?'多帧成像':'图像已压缩存储'));
    hudBTone(p<.58?'amber':'green');
    banner(4,'自执行 · 成像');
    sub('自执行', p<.58 ? '星敏精定姿（指向误差优于 0.1°）→ 相机加电自动测光'
                        : '多帧成像 → 图像压缩存储（含成像时刻 / 姿态 / 曝光参数）');

    /* 观测窗口保持打开（class 已是 on，不会重播弹出动画）→ 全程只弹一次 */
    /* 月亮出现（指向稳定、画面清晰）后再触发：先停 2s → 弹窗 5s → 关闭 */
    payload(payGate(p > .52), {
      mode:'月球定标', det:'识别到 <b>月球</b>' + (p > .58 ? ' · 成像中' : ''),
      conf:(0.93 + .05*Math.min(1,k)).toFixed(2),
      meta: p > .58 ? '曝光 1/2000s · 短曝光防过曝' : '自动测光中',
      src:'moon',
      frames: p > .58 ? Math.round(seg(p,.58,.74,'outCubic')*24) : 0
    });
  }
  /* ---------- 段 4（.76~1）回传本土地面站 ---------- */
  else {
    const k = seg(p, .76, 1, 'outCubic');
    /* 机位：直接从"卫星侧后方"平移到"地球一侧"，不再把月球推到镜头前 */
    const side = new THREE.Vector3(0,1,0).cross(moonDir).normalize();
    const upv  = moonDir.clone().cross(side).normalize();
    const from = sp.clone().addScaledVector(moonDir, -170)
                          .addScaledVector(side, 150).addScaledVector(upv, 44);
    const to   = sp.clone().addScaledVector(side, 320).addScaledVector(upv, 150);
    lerpV3(from, to, k, camPos);
    /* 视线：先看"卫星+地球"方向，后段稳定在地球，全程不让月球成为主体 */
    lerpV3(sp.clone().lerp(V(0,0,0), .55),
           V(0, 20, 0), seg(p,.76,1,'inOutCubic'), look);
    orbitLine.visible = true;
    reticle(false); warn(false);
    payload(false);

    /* 地球自转保持固定（地面站始终在卫星可见带内），不再另行转动 */
    const linked = p > .84 && p < .97;      // 回传结束即撤除数据线与脉冲环
    const gsWorld = llToVec(GS_LAT, GS_LON, R_EARTH).applyAxisAngle(V(0,1,0), earthGrp.rotation.y);
    gsRing.forEach((ring,i)=>{
      ring.visible = linked;
      if (!linked) return;
      const q = ((t*.6 + ring.userData.ph) % 1);
      ring.position.copy(gsWorld.clone().multiplyScalar(1.02));
      ring.quaternion.setFromUnitVectors(V(0,0,1), gsWorld.clone().normalize());
      ring.scale.setScalar(4 + q*44);
      ring.material.opacity = .6*(1-q);
    });
    linkBeam.visible = linked;
    if (linked){
      const mid = sp.clone().add(gsWorld).multiplyScalar(.5);
      linkBeam.position.copy(mid);
      linkBeam.scale.set(1, sp.distanceTo(gsWorld), 1);
      linkBeam.quaternion.setFromUnitVectors(V(0,1,0), gsWorld.clone().sub(sp).normalize());
      linkBeam.material.opacity = .16 + .2*(.5+.5*Math.sin(t*7));
      flowPackets(sp, gsWorld, dt, t);
    } else packets.forEach(pk=>pk.mesh.visible=false);

    const done = p > .97;
    hud('A', '成像结果', '月球图像 24 帧', '已存入星上存储器');
    hud('B', '数据下传', done ? '下传完成' : (linked ? '链路已建立' : '等待本土站窗口'),
        done ? '地面站已接收并校核' :
        (linked ? ('已传 '+(seg(p,.84,.97,'outCubic')*1.8).toFixed(1)+' / 1.8 GB') : '地球自转至可见窗口'));
    hudTone('green'); hudBTone(done||linked?'green':'amber');
    banner(5,'数据回传');
    sub('数据回传', done ? '本土地面站已接收月球图像 → 任务闭环，等待下一指令'
      : (p<.84 ? '等待地面站可见窗口（本土站）→ 建立测控 / 数传链路'
               : '向【中国大陆地面站】下传月球图像与遥测数据'));
  }

  moonMesh.rotation.y += dt*.02;
  payloadFollow(sp);                       // 小窗跟随卫星
  camera.position.copy(camPos); camera.lookAt(look);
}

/* =========================================================================
   场景 2 · 载荷算法上注（软件定义卫星的核心演示）
   叙事：原卫星只具备月球/对地/空间目标能力，无法识别特定飞机；
        地面站上注新的载荷算法包 → 星上校验 → 装订入库 → 新增识别能力。
   ========================================================================= */
function driveUpload(p, t, dt){
  gsGrp.visible = true;
  const aGS = phaseForLat(GS_LAT);
  const ang = lerp(aGS - 14, aGS + 18, seg(p, 0, 1, 'inOutSine'));
  const sp = orbitPos(ang);
  satellite.position.copy(sp);
  setOrbitRadius(ORBIT_R);
  orbitLine.visible = true;

  /* 地球自转：地面站正对卫星（上行链路沿径向，不穿地球） */
  const yaw = yawAlignSatToGround(aGS, GS_LAT, GS_LON);
  earthGrp.rotation.y = yaw;
  cloudMesh.rotation.y = yaw + t*.008;
  const gsWorld = llToVec(GS_LAT, GS_LON, R_EARTH).applyAxisAngle(V(0,1,0), yaw);

  /* 卫星数传天线对地，准备接收上行数据 */
  const toGs = gsWorld.clone().sub(sp).normalize();
  satellite.lookAt(sp.clone().addScaledVector(toGs, 130));
  satLens.material.color.setHex(0x6fe3a1);
  if (satFlame) satFlame.visible = false;

  /* 上行链路与算法包数据流（地面 → 卫星） */
  const uplink = p > .08 && p < .80;
  linkBeam.visible = uplink;
  if (uplink){
    const mid = sp.clone().add(gsWorld).multiplyScalar(.5);
    linkBeam.position.copy(mid);
    linkBeam.scale.set(1, sp.distanceTo(gsWorld), 1);
    linkBeam.quaternion.setFromUnitVectors(V(0,1,0), sp.clone().sub(gsWorld).normalize());
    linkBeam.material.opacity = .18 + .22*(.5+.5*Math.sin(t*7));
    flowPackets(gsWorld, sp, dt*1.9, t);          // 方向：地面 → 卫星（上行）
  } else packets.forEach(pk=>pk.mesh.visible=false);

  gsRing.forEach((ring,i)=>{
    ring.visible = uplink;
    if (!uplink) return;
    const q = ((t*.55 + ring.userData.ph) % 1);
    ring.position.copy(gsWorld.clone().multiplyScalar(1.02));
    ring.quaternion.setFromUnitVectors(V(0,0,1), gsWorld.clone().normalize());
    ring.scale.setScalar(4 + q*44);
    ring.material.opacity = .62*(1-q);
  });

  /* 能力清单：先显示已有能力，装订完成后新增一项 */
  capPanel(p > .24, p > .58);

  /* 镜头：地面站与卫星同框 */
  const camPos = V(), look = V();
  const mid = gsWorld.clone().lerp(sp, .5);
  const axis = sp.clone().sub(gsWorld).normalize();
  let cd = new THREE.Vector3().crossVectors(axis, V(0,1,0));
  if (cd.lengthSq() < 1e-4) cd = V(0,0,1);
  cd.normalize();
  const k = seg(p, 0, 1, 'inOutSine');
  camPos.copy(mid).addScaledVector(cd, lerp(720, 580, k))
        .addScaledVector(V(0,1,0), lerp(300, 240, k));
  look.copy(mid);

  reticle(false); warn(false);
  if (p > .24) payload(false);

  const pct = Math.round(seg(p,.10,.72,'outCubic')*100);
  hud('A', '上行算法包', '飞机目标识别 v2.1', '来自本土地面站 · 已接收 ' + pct + '%');
  hud('B', '算法状态', p<.30?'接收中':(p<.58?'校验中':(p<.84?'装订中':'已生效')),
      p<.30?'分包接收算法包':(p<.58?'签名与完整性校验 → 平台兼容性确认'
             :(p<.84?'写入星载软件环境并入库':'新能力已可用，无需硬件改动')));
  hudBTone(p>=.84?'green':(p<.58?'amber':''));

  if (p < .24)      { banner(1,'算法上注'); sub('指令接收','地面站上注新的载荷算法包：飞机目标识别算法 v2.1'); }
  else if (p < .58) { banner(2,'接收与校验'); sub('自感知','卫星接收算法包 → 校验签名与完整性 → 确认与星载平台兼容'); }
  else if (p < .84) { banner(3,'装订入库'); sub('自执行','写入星载软件环境并装订入库 → 载荷能力清单新增【飞机目标识别】'); }
  else              { banner(4,'能力生效'); sub('能力生效','算法上注完成：卫星在原有能力基础上新增飞机目标识别能力（无需硬件改动）'); }

  camera.position.copy(camPos); camera.lookAt(look);
}

/* =========================================================================
   场景 3 · 途遇废弃卫星 · 自主规避
   物理要点（依审阅意见修正）:
   · 碎片沿【自身独立轨迹】稳定飘过，与卫星轨道形成交叉 —— 碎片不受任何控制
   · 只有【卫星】做规避：从原轨道脱离 → 抬升成弧线 → 再回到标称轨道
   · 变轨为顺行加速（推力沿速度方向，喷焰向后）
   ========================================================================= */
function driveAvoid(p, t, dt){
  /* 碎片仅在场景有效时段显示；进度归零/收尾时清除，避免残留 */
  const showDeb = p > .015 && p < .985;
  debrisMesh.visible = showDeb;
  debrisTrail.line.visible = showDeb;
  satTrail.line.visible = true;
  orbitLine.visible = true;

  /* 卫星沿轨推进（缓入缓出），相位与碎片穿越点对齐 */
  const ang = 20 + 14*seg(p, 0, 1, 'inOutCubic');

  /* ---- 卫星轨道：脱离 → 抬升弧线 → 回归（半径随时间变化，始终落在"当前轨道"上） ---- */
  /* 抬起量：0 → 峰值 → 0，形成一条离开原轨又回来的弧线 */
  const out = seg(p, .42, .62, 'outCubic');          // 脱离原轨道
  const back= seg(p, .72, .96, 'inOutCubic');        // 回到标称轨道
  const lift = (out - out*back) * 42;                // 峰值 42，末端归零
  const R = ORBIT_R + lift;
  setOrbitRadius(R);                                  // 轨道环跟随重绘
  const sp = orbitPos(ang, R);
  satellite.position.copy(sp);

  const vDir = orbitVel(ang, R);
  const firing = p > .46 && p < .64;

  /* ---- 碎片：沿自身轨迹匀速飘行（完全独立，不受任何控制） ----
     物理：碎片轨迹与卫星【标称轨道】在 TCA 时刻空间交叉。
     若卫星不机动 → 两者在该点相遇（碰撞）；
     卫星实际在 TCA 前完成抬升 → 从交叉点上方安全通过。
     穿越点取 TCA 时刻的标称轨道位置，保证最小间距正好落在变轨时刻。 */
  const TCA = .62, SPD = 380;                         // 交会时刻 / 碎片速度
  const aTca = 20 + 14*seg(TCA, 0, 1, 'inOutCubic');
  const debCross = orbitPos(aTca, ORBIT_R);           // 穿越点（标称轨道上）
  const tgDir = orbitPos(aTca + 1).sub(orbitPos(aTca - 1)).normalize();
  const rdDir = orbitPos(aTca).normalize();
  const debDir = tgDir.multiplyScalar(0.45).add(rdDir.multiplyScalar(-0.35)).normalize();
  const debPos = debCross.clone().addScaledVector(debDir, (p - TCA) * SPD);
  debrisMesh.position.copy(debPos);
  debrisMesh.rotation.y += dt*.4; debrisMesh.rotation.x += dt*.15;

  /* 间距（映射为 km 量级）：逼近 → 变轨 → 拉开 */
  const gapRaw = sp.distanceTo(debPos);
  const gap = Math.max(0.35, gapRaw / 12.0);

  /* ---- 姿态 ---- */
  if (firing) satellite.lookAt(sp.clone().addScaledVector(vDir, 140));   // 顺行：喷焰向后
  else        satellite.lookAt(sp.clone().addScaledVector(debPos.clone().sub(sp).normalize(), 140));

  if (satFlame){
    satFlame.visible = firing;
    if (firing){
      const s = 1 + .34*Math.abs(Math.sin(t*19));
      satFlame.scale.set(s, 1 + .5*Math.abs(Math.sin(t*23)), s);
      satFlame.material.opacity = .6 + .34*Math.abs(Math.sin(t*17));
      satLens.material.color.setHex(0xffd166);
    } else satLens.material.color.setHex(0x6fe3a1);
  }
  pushTrail(satTrail, sp.clone());
  pushTrail(debrisTrail, debPos.clone());

  /* 警示环脉动（危险度越高闪得越快） */
  const spr = debrisMesh.userData.warnSpr;
  const risky = gap < 2.4;
  if (spr){
    const urg = clamp(1 - gap/6, 0, 1);
    const camD = camera.position.distanceTo(debPos);
    const base = clamp(camD*0.105, 24, 88);
    const sc = base*(1 + .09*Math.sin(t*(3+urg*9)));
    spr.scale.set(sc,sc,1);
    spr.material.opacity = .5 + .46*Math.abs(Math.sin(t*(2+urg*7)));
  }

  /* ---- 镜头：同时框住卫星与碎片 ---- */
  const camPos = V(), look = V();
  const mid = sp.clone().lerp(debPos,.5);
  const axis = debPos.clone().sub(sp); const sep = Math.max(axis.length(),1); axis.normalize();
  let camDir = new THREE.Vector3().crossVectors(axis, V(0,1,0));
  if (camDir.lengthSq() < 1e-4) camDir = V(0,0,1);
  camDir.normalize();
  const zoomIn = seg(p, 0, .30, 'outQuint');
  const camDist = lerp(860, Math.max(330, sep*3.0), zoomIn);
  camPos.copy(mid).addScaledVector(camDir, camDist*.80).addScaledVector(V(0,1,0), camDist*.40);
  look.copy(mid);
  if (risky && p < .66){
    const sh = (2.4-gap)/2.4*5.5;
    camPos.x += (Math.random()-.5)*sh; camPos.y += (Math.random()-.5)*sh; camPos.z += (Math.random()-.5)*sh;
  }

  /* ---- HUD ---- */
  hud('A', '最近接近距离', gap.toFixed(2)+' km', '相对速度 11.3 km/s'+(risky?' · ⚠ 危险':''));
  hudTone(risky?'red':(gap<4?'amber':''));
  /* 碰撞概率 Pc：规避前随逼近上升；规避后按实际间距回落 */
  const pcBefore = clamp(0.04 + (1 - Math.min(1, gapRaw/(ORBIT_R*0.52)))*0.93, 0, .99);
  const pcAfter  = Math.max(1e-5, pcBefore * Math.pow(0.02, seg(p,.62,.90,'outCubic')));
  const pcShown  = p < .62 ? pcBefore : pcAfter;
  hud('B', '碰撞概率 Pc', (p < .62 ? pcShown.toFixed(2) : pcShown.toExponential(1)),
      p < .62 ? '超阈值 1e-4 → 判定需规避'
              : (firing ? 'Δv 施加中（顺行加速）' : '规避后 Pc 已降至安全门限以下'));
  hudBTone(firing ? 'amber' : (p >= .62 ? 'green' : 'red'));
  warn(p > .30 && p < .62, '⚠ 碰撞预警 COLLISION WARNING');

  /* 准星跟随碎片 */
  if (p > .56 && p < .92 && !firing){
    const ndc = debPos.clone().project(camera);
    const st = document.getElementById('stage');
    const sx = (ndc.x*.5+.5)*st.clientWidth, sy = (-ndc.y*.5+.5)*st.clientHeight;
    const inView = ndc.z<1 && sx>0 && sx<st.clientWidth && sy>0 && sy<st.clientHeight;
    reticle(inView);
    if (inView){
      const el = $('hudReticle');
      el.style.left = sx+'px'; el.style.top = sy+'px'; el.style.transform='translate(-50%,-50%)';
    }
    $('reticLab').textContent = '目标锁定 · 报废卫星';
  } else reticle(false);

  /* ---- 字幕 ---- */
  if (p < .14)      { banner(1,'指令接收'); sub('指令接收','接到新任务：前往美国上空观测标记物 → 调整姿态转入转移轨道'); }
  else if (p < .30) { banner(2,'自感知'); sub('自感知','GPS 精密定轨（自身位置速度）→ 外推双方轨迹 → 计算最近接近时刻与最小距离 → 评估碰撞概率'); }
  else if (p < .44) { banner(3,'自决策'); sub('自决策','Pc 超安全阈值 → 选择规避策略（轨道抬升）→ 计算最小 Δv 与点火时刻 → 校验推进剂余量'); }
  else if (p < .82) { banner(4,'自执行 · 规避机动'); sub('自执行', firing
        ? '卫星脱离原轨道：姿态机动使推力轴沿速度方向（顺行）→ 推力器点火施加 Δv（喷焰向后，推力向前）'
        : '卫星已抬升成弧线，与碎片安全错开 → 重新定轨确认风险解除（碎片沿原轨迹继续飘行）'); }
  else              { banner(5,'轨道恢复'); sub('轨道恢复','施加反向小 Δv → 卫星从抬升轨道【返回标称轨道】→ 生成规避报告并下传地面'); }

  camera.position.copy(camPos); camera.lookAt(look);
}

/* =========================================================================
   场景 3 · 拍摄美国上空标记物（卫星在轨道线上，地球自转对齐目标）
   ========================================================================= */
function driveGround(p, t, dt){
  gsGrp.visible = false;

  /* 选择使星下点到达目标纬度的轨道相位 */
  const aImg = phaseForLat(TGT_LAT);                 // 成像时刻的相位
  const aFrom = aImg - 58, aTo = aImg + 30;
  const ang = lerp(aFrom, aTo, seg(p,0,1,'inOutSine'));
  const sp = orbitPos(ang);
  satellite.position.copy(sp);
  setOrbitRadius(ORBIT_R);
  orbitLine.visible = true;

  /* 地球自转：成像时刻把目标转到卫星下方 */
  const yawImg = yawAlignSatToGround(aImg, TGT_LAT, TGT_LON);
  const yaw = p < .62
    ? lerp(yawImg - 1.15, yawImg, seg(p,0,.62,'outQuint'))
    : yawImg;
  earthGrp.rotation.y = yaw;
  cloudMesh.rotation.y = yaw + t*.008;

  const tgtLocal = llToVec(TGT_LAT, TGT_LON, R_EARTH);
  const tgtWorld = tgtLocal.clone().applyAxisAngle(V(0,1,0), yaw);

  /* 卫星对地指向：相机(+Z)对准目标 */
  const lookDir = tgtWorld.clone().sub(sp).normalize();
  satellite.lookAt(sp.clone().addScaledVector(lookDir, 200));
  satLens.material.color.setHex(p>.52 && p<.86 ? 0xffd166 : 0x6fe3a1);
  if (satFlame) satFlame.visible = false;

  /* 目标标记 + 成像条带（挂在地球下，随自转） */
  targetMark.visible = p > .24;
  targetMark.scale.setScalar(1 + .40*Math.sin(t*4));
  const sw = seg(p,.52,.90,'inOutCubic');
  swathBand.visible = p > .52;
  if (swathBand.visible){
    const latR = TGT_LAT*DEG, bandR = R_EARTH*Math.cos(latR)*1.004;
    if (Math.abs((swathBand.userData.r0||0)-bandR) > .5){
      swathBand.geometry.dispose();
      swathBand.geometry = new THREE.TorusGeometry(bandR, 5, 6, 150, Math.PI*.30);
      swathBand.userData.r0 = bandR;
    }
    swathBand.position.set(0, R_EARTH*Math.sin(latR), 0);
    swathBand.rotation.set(Math.PI/2, 0, 0);
    swathBand.rotation.y = -sw*1.9 + 1.0;
    swathBand.material.opacity = .26 + .32*Math.sin(t*3);
  }

  /* 镜头：高空俯冲 → 对准目标 → 侧摆视角 */
  const camPos = V(), camLook = V();
  const k = seg(p,0,1,'inOutSine');
  if (p < .32){
    const kk = seg(p,0,.32,'inOutCubic');
    lerpV3(V(60, 760, 900), V(40, 320, 560), kk, camPos);
    lerpV3(V(0,0,0), V(0,0,0), kk, camLook);
  } else if (p < .60){
    const kk = seg(p,.32,.60,'inOutCubic');
    lerpV3(V(40,320,560), tgtWorld.clone().multiplyScalar(2.05).add(V(0,90,0)), kk, camPos);
    lerpV3(V(0,0,0), tgtWorld, kk, camLook);
  } else {
    const kk = seg(p,.60,1,'inOutSine');
    const b = tgtWorld.clone().multiplyScalar(2.05).add(V(0,90,0));
    const c = tgtWorld.clone().multiplyScalar(2.62).add(V(104,215,72));
    lerpV3(b,c,kk,camPos);
    lerpV3(tgtWorld, tgtWorld.clone().lerp(sp,.30), kk, camLook);
  }

  /* HUD */
  hud('A','目标点', TGT_LAT.toFixed(1)+'°N  '+Math.abs(TGT_LON).toFixed(1)+'°W', '美国中部（示意）');
  hud('B', p<.52?'过境窗口':(p<.86?'成像条带':'成像完成'),
      p<.52?'预计 T-4 分 12 秒':(p<.86?'推扫中 · 侧摆 0°':'共 24 帧已存储'),
      p<.52?'轨道预报已确认可观测':'分辨率 0.8 m · 可见光');
  hudBTone(p<.52?'amber':'green');
  reticle(false); warn(false);

  /* 载荷观测窗口：成像段弹出（小窗靠卫星侧，不遮挡主体） */
  const inImg = p > .62 && p < .90;
  if (inImg){
    payload(payGate(p > .66), {
      mode:'对地成像 + 飞机识别', det:'识别到 <b>飞机</b>（新算法）',
      conf:(0.88 + .08*seg(p,.62,.88,'outCubic')).toFixed(2),
      meta:'曝光 1/1200s · 分辨率 0.8m', src:'aircraft',
      frames: Math.round(seg(p,.68,.90,'outCubic')*24)
    });
  } else {
    payload(false);          // 成像结束 → 关闭识别框与弹窗
  }

  if (p < .15)      { banner(1,'指令接收'); sub('指令接收','地面站上注任务：拍摄美国上空标记物（含目标经纬度）'); }
  else if (p < .33) { banner(2,'自感知'); sub('自感知','GPS 取轨道位置速度 · 读当前姿态 · 解析目标点坐标 · 读电源与存储余量'); }
  else if (p < .50) { banner(3,'自决策'); sub('自决策','轨道预报算过境时刻 → 计算可观测窗口与侧摆角 → 排定成像时序与曝光参数'); }
  else if (p < .80) { banner(4,'自执行 · 对地成像'); sub('自执行', p<.62 ? '姿态预置 → 对地指向机动 → 精指向稳定'
                                        : '按条带推扫成像 → 图像压缩存储并打标签'); }
  else              { banner(5,'数据回传'); sub('数据回传','记录待传队列 → 等待卫星返回本土上空后下传'); }

  payloadFollow(sp);
  camera.position.copy(camPos); camera.lookAt(camLook);
}

/* =========================================================================
   场景 4 · 返回本土上空 · 图像回传
   ========================================================================= */
function driveDownlink(p, t, dt){
  gsGrp.visible = true;

  /* 卫星在轨（本土站可见窗口），地球自转把站点带到星下 */
  const aImg = phaseForLat(GS_LAT);
  const ang = lerp(aImg - 26, aImg + 14, seg(p,0,1,'inOutSine'));
  const sp = orbitPos(ang);
  satellite.position.copy(sp);
  setOrbitRadius(ORBIT_R);
  orbitLine.visible = true;

  const yawSt = yawAlignSatToGround(aImg, GS_LAT, GS_LON);
  const yaw = p < .46
    ? lerp(yawSt - .85, yawSt, seg(p,0,.46,'inOutCubic'))
    : yawSt;
  earthGrp.rotation.y = yaw;
  cloudMesh.rotation.y = yaw + t*.008;

  const gsLocal = llToVec(GS_LAT, GS_LON, R_EARTH);
  const gsWorld = gsLocal.clone().applyAxisAngle(V(0,1,0), yaw);

  /* 数传天线(-Y)对地 → 卫星本体系 -Y 指向地面站 */
  const toGs = gsWorld.clone().sub(sp).normalize();
  satellite.lookAt(sp.clone().addScaledVector(toGs, 100));   // 简化：视线方向对地，天线随之朝向地面
  satLens.material.color.setHex(0x6fe3a1);
  if (satFlame) satFlame.visible = false;

  /* 链路与数据包 */
  const linked = p > .46 && p < .90;
  linkBeam.visible = linked;
  if (linked){
    const mid = sp.clone().add(gsWorld).multiplyScalar(.5);
    linkBeam.position.copy(mid);
    linkBeam.scale.set(1, sp.distanceTo(gsWorld), 1);
    linkBeam.quaternion.setFromUnitVectors(V(0,1,0), gsWorld.clone().sub(sp).normalize());
    linkBeam.material.opacity = .16 + .2*(.5+.5*Math.sin(t*7));
    flowPackets(sp, gsWorld, dt, t);
  } else packets.forEach(pk=>pk.mesh.visible=false);

  gsRing.forEach((ring,i)=>{
    ring.visible = linked;
    if (!linked) return;
    const q = ((t*.6 + ring.userData.ph) % 1);
    ring.position.copy(gsWorld.clone().multiplyScalar(1.02));
    ring.quaternion.setFromUnitVectors(V(0,0,1), gsWorld.clone().normalize());
    ring.scale.setScalar(4 + q*46);
    ring.material.opacity = .6*(1-q);
  });

  /* 镜头：中景横移 + 缓推（卫星与地面站同时入画） */
  const camPos = V(), camLook = V();
  const k = seg(p,0,1,'inOutSine');
  const c0 = gsWorld.clone().multiplyScalar(3.2).add(V(160,185,205));
  const c1 = gsWorld.clone().multiplyScalar(2.80).add(V(66,240,118));
  lerpV3(c0,c1,k,camPos);
  lerpV3(gsWorld.clone().lerp(sp,.52), sp.clone().lerp(gsWorld,.42), k, camLook);

  /* HUD：链路状态与进度保持一致（下传完成后不再显示"待建链"） */
  const done = clamp((p-.46)/.42, 0, 1);
  const finished = done >= 1;
  hud('A','下行速率', linked ? (p>.9?'96 Mbps':'120 Mbps') : '—',
      linked ? 'X 波段 · 链路良好' : (p > .90 ? '下传完成' : '等待过境建链'));
  hud('B','下传进度', Math.round(done*100)+'%',
      linked ? ('已传 '+(done*2.4).toFixed(1)+' / 2.4 GB') : (p > .90 ? '已全部下传' : '待建链'));
  hudBTone(linked ? 'green' : (finished ? 'green' : ''));
  reticle(false); warn(false);
  dlProgress(done, linked ? (p>.9?'96 Mbps':'120 Mbps') : null);

  if (p < .15)      { banner(1,'数据就绪'); sub('数据就绪','图像压缩打包 → 附加辅助数据（成像时刻 / 姿态 / 曝光参数）→ 存入星上存储器'); }
  else if (p < .33) { banner(2,'自感知'); sub('自感知','监测存储余量与待传队列 · 预报本土地面站可见窗口 · 监测链路状态'); }
  else if (p < .46) { banner(3,'自决策'); sub('自决策','制定下传计划（按优先级排序）· 选择下行速率与调制方式'); }
  else if (p < .86) { banner(4,'自执行 · 下行数传'); sub('自执行', linked ? '卫星已返回本土上空 → 建立测控 / 数传链路 → 按优先级下传并校验重传'
                                         : '卫星返回本土上空 → 姿态调整使数传天线对准地面站'); }
  else              { banner(5,'地面接收'); sub('地面接收','地面站接收解调 · 数据校核 · 分发给用户'); }

  payloadFollow(sp);
  camera.position.copy(camPos); camera.lookAt(camLook);
}

/* 数据包沿线流动（通用） */
function flowPackets(from, to, dt, t){
  const perp = new THREE.Vector3(0,1,0).cross(to.clone().sub(from).normalize());
  packets.forEach(pk=>{
    pk.t += dt*pk.spd*.62;
    if (pk.t > 1) pk.t -= 1;
    pk.mesh.visible = pk.t > .04;
    const q = pk.t;
    const p3 = from.clone().lerp(to, q);
    const mid = from.clone().add(to).multiplyScalar(.5).addScaledVector(perp, 24*Math.sin(Math.PI*q));
    p3.lerp(mid, .28*Math.sin(Math.PI*q));
    pk.mesh.position.copy(p3);
    pk.mesh.material.opacity = .95*(1-Math.pow(q,3));
    pk.mesh.material.color.setHex(q < .55 ? 0xffd166 : 0x57d6ff);
  });
}

const $ = id => document.getElementById(id);
function sub(ph, tx){ $('subPh').textContent = ph; $('subTx').textContent = tx; }
/* 顶部居中横幅：显示当前任务环节（随阶段切换） */
let banLast = '';
function banner(stepNo, text){
  if (text === banLast) return;
  banLast = text;
  $('banStep').textContent = String(stepNo).padStart(2,'0');
  $('banTx').textContent = text;
  const el = $('banner');
  el.style.animation = 'none'; void el.offsetWidth;
  el.style.animation = 'bannerPop .40s cubic-bezier(.2,.9,.3,1.2)';
}
function reticle(on){ $('hudReticle').classList.toggle('on', !!on); }
function warn(on, txt){ const el=$('warnBox'); if(txt) el.textContent=txt; el.classList.toggle('on', !!on); }
function hud(which, lbl, val, row2){
  $('hud'+which).style.display='block';
  $('hud'+which+'_l').textContent=lbl; $('hud'+which+'_v').textContent=val;
  $('hud'+which+'_r').textContent=row2||'';
}
function hudTone(t){ $('hudA_v').className = 'num'+(t?' '+t:''); }
function hudBTone(t){ $('hudB_v').className = 'num'+(t?' '+t:''); }

/* ---- 载荷观测窗口 ---- */
const pwCv = () => $('pwCanvas');
/* ---- 观测窗展示门控（三段式） ----
   目标到达时先【暂停 PRE_MS】让画面停住 → 再渐变弹出观测窗并【停留 HOLD_MS】
   → 到时自动关闭、动画继续。两个冻结阶段都不推进进度。
   phase: idle(未到) → pre(先停2s) → show(弹窗展示5s) → done(已展示完) */
const PRE_MS  = 2000;      // 到达后先暂停 2 秒
const HOLD_MS = 5000;      // 观测窗展示 5 秒
const PAY = { phase:'idle', until:0 };
function payGate(want){
  const now = performance.now();
  if (PAY.phase === 'done') return false;          // 本场景已展示完 → 不再触发
  if (!want){
    if (PAY.phase !== 'idle'){ PAY.phase = 'done'; }   // 被外部中断 → 收尾
    return false;
  }
  if (PAY.phase === 'idle'){                       // 刚到达：进入"先暂停"段
    PAY.phase = 'pre'; PAY.until = now + PRE_MS;
    return false;
  }
  if (PAY.phase === 'pre'){
    if (now < PAY.until) return false;             // 仍在暂停（窗口未显）
    PAY.phase = 'show'; PAY.until = now + HOLD_MS; // 暂停结束 → 弹出并计时
    return true;
  }
  // show 阶段
  if (now < PAY.until) return true;                // 展示中（冻结）
  PAY.phase = 'done';                              // 展示结束 → 关闭
  markGroupDone();                                 // 本段任务闭环 → 一级任务框转绿打 ✓
  return false;
}
/* 是否处于冻结期（pre 暂停 / show 展示，两者都不推进动画） */
function payHold(){ return PAY.phase === 'pre' || PAY.phase === 'show'; }
function payReset(){
  PAY.phase = 'idle'; PAY.until = 0;
  const gi = GROUPS.findIndex(g => g.scenes.indexOf(cur) >= 0);
  const b = GROUPS[gi] && document.querySelector('.gbtn[data-g="'+GROUPS[gi].id+'"]');
  if (b) b.classList.remove('done','pulse');       // 重播时清除完成标记
}
/* 一级任务（分组）完成：该分组按钮转绿 + ✓ + 脉冲一次 */
function markGroupDone(){
  const gi = GROUPS.findIndex(g => g.scenes.indexOf(cur) >= 0);
  const b = GROUPS[gi] && document.querySelector('.gbtn[data-g="'+GROUPS[gi].id+'"]');
  if (!b || b.classList.contains('done')) return;
  b.classList.add('done','pulse');
  b.addEventListener('animationend', ()=> b.classList.remove('pulse'), { once:true });
}

function payload(on, info){
  const el = $('payloadWin');
  if (!on){ payloadHide(el); return; }
  const wasOff = !el.classList.contains('on');
  el.classList.add('on');
  if (wasOff){                                   // 由关→开：渐进切换（模糊 → 清晰 + 微放大）
    el.getAnimations().forEach(a => a.cancel());
    el.animate([
      {opacity:0, filter:'blur(7px)', transform:'translate(-50%,-50%) scale(.90)'},
      {opacity:1, filter:'blur(1.5px)', offset:.55},
      {opacity:1, filter:'blur(0)',    transform:'translate(-50%,-50%) scale(1)'}
    ], {duration:620, easing:'cubic-bezier(.22,.9,.3,1.02)', fill:'none'});
  }
  $('pwMode').textContent = info.mode;
  $('pwDet').innerHTML = info.det;
  $('pwConf').textContent = info.conf;
  $('pwMeta').textContent = info.meta;
  drawPayload(info);
}
/* 关闭：由 JS 淡出（.on 移除后即可清除 animation，避免残留帧） */
function payloadHide(el){
  if (!el.classList.contains('on')) return;
  el.classList.remove('on');
  const a = el.animate([{opacity:1},{opacity:0}],
    {duration:300, easing:'cubic-bezier(.4,0,.6,1)', fill:'forwards'});
  a.finished.then(()=>{ a.cancel(); el.getAnimations().forEach(x=>x.cancel()); }).catch(()=>{});
}
/* 观测窗口固定在左下角（保持位置稳定，便于远看与录制） */
function payloadFollow(){ /* 位置由 CSS 固定，无需跟随 */ }
function payloadClear(){
  const el = $('payloadWin');
  if (el){ el.classList.remove('on'); el.getAnimations().forEach(a => a.cancel()); }
  capPanel(false);
}
/* 场景切换瞬间清空：不做淡出，直接归零 */
function payloadKill(){
  const el = $('payloadWin');
  if (!el) return;
  el.classList.remove('on');
  el.getAnimations().forEach(a => a.cancel());
  el.style.opacity = '';
}

/* ---- 载荷能力清单（软件定义的核心体现：算法上注后新增能力） ---- */
const CAPS_BASE = ['月球定标', '对地成像', '空间目标观测'];
const CAP_NEW   = '飞机目标识别';
function capPanel(on, withNew){
  const el = $('capPanel');
  if (!el) return;
  el.classList.toggle('on', !!on);
  if (!on){ el.dataset.sig = ''; return; }
  const list = CAPS_BASE.concat(withNew ? [CAP_NEW] : []);
  const sig = list.join('|');
  if (el.dataset.sig === sig) return;
  el.dataset.sig = sig;
  $('capList').innerHTML = list.map(c => {
    const isNew = (c === CAP_NEW);
    return '<div class="it' + (isNew ? ' new' : '') + '">' +
           '<span class="ck">' + (isNew ? '+' : '✓') + '</span>' + c + '</div>';
  }).join('');
}
function drawPayload(info){
  const cv = pwCv(), c = cv.getContext('2d');
  /* 全屏窗口：画布按容器实际尺寸 × DPR 设置，保证清晰 */
  const box = cv.parentElement;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = Math.max(320, box.clientWidth || 1120);
  const ch = Math.max(200, box.clientHeight || 660);
  if (cv.width !== Math.round(cw*dpr) || cv.height !== Math.round(ch*dpr)) {
    cv.width  = Math.round(cw*dpr);
    cv.height = Math.round(ch*dpr);
  }
  const W = cv.width, H = cv.height;
  c.fillStyle = '#04070d'; c.fillRect(0,0,W,H);

  if (info.src === 'moon' && moonImg && moonImg.complete && moonImg.naturalWidth){
    /* 用真实月球贴图绘制"拍摄画面"，并按日-月-星几何加月相阴影 */
    const R = H*0.40, cx = W*0.46, cy = H*0.50;
    c.save();
    c.beginPath(); c.arc(cx,cy,R,0,7); c.clip();
    c.drawImage(moonImg, cx-R, cy-R, R*2, R*2);
    /* 月相阴影 */
    c.fillStyle = 'rgba(3,5,10,.93)';
    c.beginPath(); c.arc(cx + R*0.66, cy, R*1.02, 0, 7); c.fill();
    /* 环形山强化（用贴图自带细节，这里只做轻微压暗） */
    const g = c.createRadialGradient(cx-R*.3, cy-R*.3, R*.1, cx, cy, R);
    g.addColorStop(0,'rgba(255,255,255,.10)'); g.addColorStop(1,'rgba(0,0,0,.28)');
    c.fillStyle = g; c.fillRect(cx-R,cy-R,R*2,R*2);
    c.restore();
    /* 识别框 */
    detectBox(c, cx-R*0.86, cy-R*0.86, R*1.72, R*1.72, '月球定标', info.conf);
  } else if (info.src === 'aircraft' && earthImg && earthImg.complete && earthImg.naturalWidth){
    /* 对地成像 + 新上注算法识别出的飞机目标 */
    const sw = earthImg.naturalWidth, sh = earthImg.naturalHeight;
    const u = ((TGT_LON + 180) / 360) * sw;
    const v = ((90 - TGT_LAT) / 180) * sh;
    const cw = sw*0.24, ch = sh*0.24;
    c.drawImage(earthImg, clamp(u-cw/2,0,sw-cw), clamp(v-ch/2,0,sh-ch), cw, ch, 0, 0, W, H);
    /* 网格 */
    c.strokeStyle='rgba(120,200,255,.16)'; c.lineWidth=1;
    for (let x=0;x<W;x+=W/9){ c.beginPath(); c.moveTo(x,0); c.lineTo(x,H); c.stroke(); }
    for (let y=0;y<H;y+=H/7){ c.beginPath(); c.moveTo(0,y); c.lineTo(W,y); c.stroke(); }
    /* 飞机剪影（示意） */
    const ax = W*0.50, ay = H*0.46, sc = Math.min(W,H)/190;
    c.save(); c.translate(ax, ay); c.rotate(-0.35); c.scale(sc, sc);
    c.fillStyle = '#dce8f5';
    c.beginPath();                                  // 机身+机翼简化轮廓
    c.moveTo(0,-26); c.lineTo(5,-6); c.lineTo(30,4); c.lineTo(30,10);
    c.lineTo(6,4); c.lineTo(5,16); c.lineTo(14,24); c.lineTo(14,28);
    c.lineTo(0,23); c.lineTo(-14,28); c.lineTo(-14,24); c.lineTo(-5,16);
    c.lineTo(-6,4); c.lineTo(-30,10); c.lineTo(-30,4); c.lineTo(-5,-6);
    c.closePath(); c.fill();
    c.restore();
    /* 识别框（来自"飞机目标识别 v2.1"新算法） */
    detectBox(c, ax-W*0.155, ay-H*0.185, W*0.31, H*0.37, '飞机 v2.1', info.conf);
    c.fillStyle='rgba(255,209,102,.85)'; c.font='12px Consolas, monospace';
    c.fillText('ALGO: aircraft-recog v2.1 (刚刚上注)', 12, H-34);
  } else if (info.src === 'earth' && earthImg && earthImg.complete && earthImg.naturalWidth){
    /* 用真实地球贴图裁出目标区域作为"拍摄画面" */
    const sw = earthImg.naturalWidth, sh = earthImg.naturalHeight;
    /* 目标经纬度 → 贴图 UV（等距圆柱） */
    const u = ((TGT_LON + 180) / 360) * sw;
    const v = ((90 - TGT_LAT) / 180) * sh;
    const cw = sw*0.20, ch = sh*0.20;
    c.drawImage(earthImg, clamp(u-cw/2,0,sw-cw), clamp(v-ch/2,0,sh-ch), cw, ch, 0, 0, W, H);
    /* 网格 + 识别框 */
    c.strokeStyle='rgba(120,200,255,.16)'; c.lineWidth=1;
    for (let x=0;x<W;x+=W/9){ c.beginPath(); c.moveTo(x,0); c.lineTo(x,H); c.stroke(); }
    for (let y=0;y<H;y+=H/7){ c.beginPath(); c.moveTo(0,y); c.lineTo(W,y); c.stroke(); }
    detectBox(c, W*0.30, H*0.28, W*0.40, H*0.44, '地标匹配', info.conf);
  }
  /* 通用叠加：时间戳与帧号 */
  c.fillStyle='rgba(140,200,255,.72)'; c.font='13px Consolas, monospace';
  c.fillText('SD-SAT / CAM-1   ' + new Date().toISOString().slice(0,19).replace('T',' '), 12, 22);
  c.fillStyle='rgba(111,227,161,.9)';
  c.fillText('FRAME ' + String(info.frames||0).padStart(3,'0') + '   ● REC', 12, H-14);
}
function detectBox(c,x,y,w,h,label,conf){
  c.save();
  c.strokeStyle='#6fe3a1'; c.lineWidth=2.6; c.setLineDash([]);
  const L = Math.max(12, Math.min(22, w*0.16));
  c.beginPath();
  c.moveTo(x,y+L); c.lineTo(x,y); c.lineTo(x+L,y);
  c.moveTo(x+w-L,y); c.lineTo(x+w,y); c.lineTo(x+w,y+L);
  c.moveTo(x+w,y+h-L); c.lineTo(x+w,y+h); c.lineTo(x+w-L,y+h);
  c.moveTo(x+L,y+h); c.lineTo(x,y+h); c.lineTo(x,y+h-L);
  c.stroke();
  const mx=x+w/2, my=y+h/2;
  c.strokeStyle='rgba(111,227,161,.7)'; c.lineWidth=1;
  c.beginPath(); c.moveTo(mx-10,my); c.lineTo(mx+10,my); c.moveTo(mx,my-10); c.lineTo(mx,my+10); c.stroke();
  c.font='13px Consolas, monospace';
  const txt = label + '  ' + conf;
  const tw = c.measureText(txt).width;
  c.fillStyle='rgba(6,12,22,.9)'; c.fillRect(x, y-24, tw+14, 20);
  c.fillStyle='#6fe3a1'; c.fillText(label, x+7, y-9);
  c.fillStyle='#cfe3ff'; c.fillText(conf, x+7+c.measureText(label+'  ').width, y-9);
  c.restore();
}

/* ---- 右侧任务栏：阶段框依次弹出 ---- */
let panelScene = -1;
function buildPanel(sc){
  if (panelScene === sc.id) return;
  panelScene = sc.id;
  $('pTitle').textContent = sc.name;
  $('pSub').textContent = sc.sub;
  $('pCap').textContent = sc.cap;
  $('pBody').innerHTML = '';
  if (sc.id === 4){
    $('pBody').insertAdjacentHTML('beforeend',
      '<div class="dlbar"><div class="hd"><span>数传下传进度</span><b id="dlTxt">0%</b></div>'+
      '<div class="tr"><i id="dlBar2"></i></div></div>');
  }
  sc.phases.forEach(ph => ph._el = null);
}
function panelReset(sc){
  $('pBody').innerHTML = '';
  if (sc.id === 4){
    $('pBody').insertAdjacentHTML('beforeend',
      '<div class="dlbar"><div class="hd"><span>数传下传进度</span><b id="dlTxt">0%</b></div>'+
      '<div class="tr"><i id="dlBar2"></i></div></div>');
  }
  sc.phases.forEach(ph => ph._el = null);
}
function dlProgress(v, rate){
  const b = $('dlBar2'); if (!b) return;
  b.style.width = (v*100).toFixed(1)+'%';
  $('dlTxt').textContent = Math.round(v*100)+'%' + (rate ? ' · '+rate : '');
}
/* 关键：阶段框"依次弹出"；子项在阶段内逐条浮现 */
function updatePanel(sc, p){
  const body = $('pBody');
  sc.phases.forEach((ph,i)=>{
    if (p + 1e-6 >= ph.at && !ph._el){
      const el = document.createElement('div');
      el.className = 'phase';
      el.innerHTML = '<div class="ph"><span>'+ph.k+'</span><span class="badge">进行中</span></div>'+
        '<ul>'+ph.items.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
      body.appendChild(el);
      ph._el = el;
      body.scrollTop = body.scrollHeight;
    }
  });
  sc.phases.forEach((ph,i)=>{
    if (!ph._el) return;
    const nextAt = i+1 < sc.phases.length ? sc.phases[i+1].at : 1.001;
    const done = p >= nextAt;
    ph._el.classList.toggle('done', done);
    ph._el.classList.toggle('active', !done);
    ph._el.querySelector('.badge').textContent = done ? '已完成' : '进行中';
    const lis = ph._el.querySelectorAll('li');
    let showN;
    if (done) showN = lis.length;
    else {
      const span = Math.max(nextAt - ph.at, 1e-6);
      const prog = clamp((p - ph.at)/span, 0, 1);
      showN = Math.max(1, Math.ceil(prog * lis.length));
    }
    lis.forEach((li,j)=> li.classList.toggle('show', j < showN));
  });
}

/* =========================================================================
   主循环
   ========================================================================= */
let cur = 1, prog = 0, playing = true, speed = 1, lastT = performance.now(), ready = false;

function setScene(n, pushUrl){
  n = clamp(parseInt(n,10)||1, 1, SCENES.length);
  cur = n; prog = 0;
  const sc = SCENES[cur-1];
  hideAll();
  buildPanel(sc);
  panelReset(sc);
  $('hbK').textContent = 'SCENE 0'+sc.id;
  $('hbV').textContent = sc.name;
  $('hbS').textContent = sc.sub + ' · ' + sc.motion;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', +b.dataset.n===cur));
  const gi = GROUPS.findIndex(g => g.scenes.indexOf(cur) >= 0);      // 高亮所属一级分组
  document.querySelectorAll('.gbtn').forEach(b=>{
    b.classList.toggle('active', b.dataset.g === (GROUPS[gi]||{}).id);
    b.classList.remove('done','pulse');                                // 切段清除完成标记
  });
  $('hudA').style.display='none'; $('hudB').style.display='none';
  if (pushUrl !== false) syncUrl();
}
function syncUrl(){
  const u = new URL(location.href);
  u.searchParams.set('scene', cur);
  u.searchParams.delete('t');
  history.replaceState(null,'',u.toString());
  $('urlinfo').innerHTML = 'URL: <b>?scene='+cur+'</b>　（改数字即切换）';
}
function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now-lastT)/1000, .05); lastT = now;
  if (!ready) return;

  const sc = SCENES[cur-1];
  if (playing && !payHold()){                      // 观测窗展示期间冻结动画
    prog += dt*speed/sc.dur;
    if (prog >= 1){ prog = 0; panelReset(sc); payReset(); }   // 循环 → 任务栏与门控一并重置
  }
  const t = now/1000;
  if (satFlame) satFlame.visible = false;           // 每帧复位，由场景按需打开

  sc.drive(prog, t, dt);
  updatePanel(sc, prog);
  $('prog').style.width = (prog*100).toFixed(2)+'%';
  renderer.render(scene, camera);
}

/* =========================================================================
   启动
   ========================================================================= */
function boot(){
  const q = new URLSearchParams(location.search);
  let n = 1;
  if (q.has('scene'))  n = parseInt(q.get('scene'),10) || 1;
  else if (q.has('t')) n = ((Math.abs(parseInt(q.get('t'),10)||1) - 1) % SCENES.length) + 1;

  initThree();
  ready = true;

  const tabs = $('tabs');
  tabs.className = 'tabrows';                        // 纵向两行
  /* 两行标签：第一行 = 月亮拍摄任务；第二行 = 新拍摄任务（含 4 个场景） */
  GROUPS.forEach(g => {
    const row = document.createElement('div');
    row.className = 'tabrow';
    const gb = document.createElement('button');
    gb.className = 'gbtn'; gb.dataset.g = g.id;
    gb.textContent = g.name;
    gb.onclick = () => { setScene(g.scenes[0]); };   // 点击分组跳到该组首个场景
    row.appendChild(gb);
    g.scenes.forEach(id => {
      const sc = SCENES[id-1];
      const b = document.createElement('button');
      b.className = 'tab'; b.dataset.n = sc.id;
      b.innerHTML = '<span class="n">0'+sc.id+'</span>'+sc.name;
      b.onclick = () => setScene(sc.id);
      row.appendChild(b);
    });
    tabs.appendChild(row);
  });

  setScene(n, false);
  $('urlinfo').innerHTML = 'URL: <b>?scene='+cur+'</b>　（改数字即切换）';
  $('loading').classList.add('hide');
  animate();
}

$('btnPlay').onclick = function(){
  playing = !playing;
  this.textContent = playing ? '⏸ 暂停' : '▶ 播放';
};
$('btnSpeed').onclick = function(){
  const arr=[1,.5,1.5,2]; speed = arr[(arr.indexOf(speed)+1)%arr.length];
  this.textContent = speed.toFixed(1)+'×';
};
addEventListener('keydown', e=>{
  if (e.code==='Space'){ e.preventDefault(); $('btnPlay').click(); }
  if (e.key>='1' && e.key<=String(SCENES.length)) setScene(+e.key);
});

(function waitAssets(){
  const bar = $('ldBar'); let p=0;
  const iv = setInterval(()=>{ p=Math.min(p+9,92); bar.style.width=p+'%'; }, 55);
  const start = ()=>{ clearInterval(iv); bar.style.width='100%';
    setTimeout(()=>{ try{ boot(); }catch(err){ console.error(err);
      document.querySelector('#loading .tt').textContent = '启动失败：'+err.message; } }, 120); };
  if (document.readyState==='complete') setTimeout(start,260);
  else addEventListener('load', ()=> setTimeout(start,260));
})();

window.DEMO = {
  setScene,
  get scene(){ return cur; },
  setProgress(v){ payReset(); prog = clamp(v,0,1); playing=false; $('btnPlay').textContent='▶ 播放'; },
  play(){ playing=true; }, pause(){ playing=false; },
  get progress(){ return prog; },
};
</script>
